<!doctype html>

<html lang="en">
    <head>
        <meta charset="UTF-8" />

        
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <link rel="icon" type="image/png" href="/favicon.png" />

        <title>Painting App</title>
        
    </head>

    <body>
        <div id="app">
            
            <header id="app-header">
                <div id="header-menus">
                    <div class="download-menu">
                        <button
                            type="button"
                            class="header-action-placeholder"
                            id="download-canvas"
                            aria-haspopup="true"
                            aria-expanded="false"
                        >
                            Download Canvas
                        </button>
                        <div class="download-menu-options" id="download-options">
                            <button type="button" data-format="png">PNG</button>
                            <button type="button" data-format="jpeg">JPEG</button>
                            <button type="button" data-format="jpg">JPG</button>
                        </div>
                    </div>
                    <label for="stroke">Stroke Width</label>
                    <input
                        type="number"
                        id="stroke"
                        name="stroke"
                        min="0"
                        max="100"
                        step="1"
                        value="1"
                    >
                </div>

                <div id="header-actions">
                    <button class="header-action-placeholder" title="Undo" id="undo"><i class="fa-solid fa-rotate-left"></i></button>
                    <button class="header-action-placeholder" title="Redo" id="redo"><i class="fa-solid fa-rotate-right"></i></button>
                </div>
            </header>

            <main id="app-main">
                <aside id="tool-panel">

                </aside>

                <section id="workspace">
                    <div id="pixi-container"></div>
                </section>
            </main>
        </div>

        <script type="module" src="/src/main.js"></script>
        
    </body>
</html>
